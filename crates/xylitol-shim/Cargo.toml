[package]
name = "xylitol-shim"
description = "Runs an Android app's native code directly on Linux: no emulator, container or Android runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xylitol-apk = { path = "../xylitol-apk", version = "0.1.0" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
object = { version = "0.36", default-features = false, features = ["read", "std", "elf"] }
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
