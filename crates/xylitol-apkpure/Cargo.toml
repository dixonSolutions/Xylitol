[package]
name = "xylitol-apkpure"
description = "APKPure client: search apps, list every published build variant, and download them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip", "json"] }
scraper = "0.21"
sha1 = "0.10"
urlencoding = "2"

[dev-dependencies]
xylitol-apk = { path = "../xylitol-apk", version = "0.1.0" }
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
