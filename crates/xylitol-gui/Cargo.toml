[package]
name = "xylitol-gui"
description = "Xylitol: a GNOME app for finding, downloading and installing Android packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "xylitol"
path = "src/main.rs"

[dependencies]
xylitol-core = { path = "../xylitol-core", version = "0.1.0" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
