name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev desktop-file-utils appstream

      - name: Validate the desktop and AppStream metadata
        run: |
          desktop-file-validate data/dev.xylitol.Xylitol.desktop
          appstreamcli validate --no-net data/dev.xylitol.Xylitol.metainfo.xml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      # The live tests are #[ignore]d: APKPure rate-limits by address, and a
      # shared CI egress IP would be locked out within a few runs.
      - name: Test
        run: cargo test --workspace
