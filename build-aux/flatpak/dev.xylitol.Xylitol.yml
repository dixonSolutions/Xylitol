# Flatpak manifest for Xylitol.
#
# Build locally with:
#   flatpak-builder --user --install --force-clean \
#       build/flatpak build-aux/flatpak/dev.xylitol.Xylitol.yml
id: dev.xylitol.Xylitol
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: xylitol

finish-args:
  # Xylitol's whole job is fetching packages.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Read access to the download folder, so `inspect` and `library add` work on a
  # file you already have. Read-only is enough: the library index lives in the
  # app's own data directory, and a host-side adb reads the file with the host's
  # permissions rather than ours.
  - --filesystem=xdg-download:ro
  # Installing a package means driving Waydroid or adb, which live on the host.
  # Without this the app still searches, downloads and inspects; only the
  # Install button stops working. See the README for what this permission means.
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/xylitol/cargo
    # Release builds only; the debug binary is ~160 MB.
    CARGO_PROFILE_RELEASE_DEBUG: 'false'
  build-args:
    # Cargo resolves the dependency tree during the build. Flathub forbids
    # this and would want a generated cargo-sources.json instead; for a
    # self-hosted remote it is simpler and one less thing to regenerate.
    - --share=network

modules:
  - name: xylitol
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/xylitol      /app/bin/xylitol
      - install -Dm755 target/release/xylitol-cli  /app/bin/xylitol-cli
      - install -Dm644 data/dev.xylitol.Xylitol.desktop
        /app/share/applications/dev.xylitol.Xylitol.desktop
      - install -Dm644 data/dev.xylitol.Xylitol.metainfo.xml
        /app/share/metainfo/dev.xylitol.Xylitol.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/dev.xylitol.Xylitol.svg
        /app/share/icons/hicolor/scalable/apps/dev.xylitol.Xylitol.svg
    sources:
      - type: dir
        path: ../..
